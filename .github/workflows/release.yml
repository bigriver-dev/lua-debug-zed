name: Release lua-dap-server binaries

on:
  push:
    branches: ["main"]
    paths:
      - "zed-extension/extension.toml"

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version bump
        id: check
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' zed-extension/extension.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged — skipping release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag this release
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"
  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            arch_name: x86_64
            ext: ".exe"
          - os: macos-latest
            os_name: macos
            arch_name: aarch64
            ext: ""
          - os: ubuntu-latest
            os_name: linux
            arch_name: x86_64
            ext: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build all Lua versions
        shell: bash
        run: |
          mkdir -p dist
          for feature in lua51 lua52 lua53 lua54 lua55 luajit; do
            cargo build --release -p lua-dap-server --no-default-features --features "$feature"
            cp "target/release/lua-dap-server${{ matrix.ext }}" "dist/lua-dap-server-${feature}${{ matrix.ext }}"
          done

      - name: Zip platform bundle
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../lua-dap-server-${{ matrix.os_name }}-${{ matrix.arch_name }}.zip" *
          else
            zip "../lua-dap-server-${{ matrix.os_name }}-${{ matrix.arch_name }}.zip" *
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lua-dap-server-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: lua-dap-server-*.zip

  package-extension-source:
      needs: check-version
      if: needs.check-version.outputs.should_release == 'true'
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Zip extension source
          shell: bash
          run: |
            cd zed-extension
            zip -r "../lua-debugger-extension-source.zip" extension.toml Cargo.toml Cargo.lock src debug_adapter_schemas

        - uses: actions/upload-artifact@v4
          with:
            name: lua-debugger-extension-source
            path: lua-debugger-extension-source.zip

  release:
    needs: [check-version, build, package-extension-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          files: dist/*.zip
