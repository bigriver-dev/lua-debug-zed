[package]
name = "lua-dap-server"
version = "0.1.0"
edition = "2024"

[features]
default = ["lua53"]
lua51 = ["mlua/lua51"]
lua52 = ["mlua/lua52"]
lua53 = ["mlua/lua53"]
lua54 = ["mlua/lua54"]
lua55 = ["mlua/lua55"]
luajit = ["mlua/luajit", "mlua/vendored"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"

# Windows needs to link dynamically against a real luaXX.dll
# see scripts/windows/build-lua-dll.ps1
[target.'cfg(not(windows))'.dependencies]
mlua = { version = "0.12", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
mlua = { version = "0.12" }
