[package]
name = "lua-dap-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# 'vendored' compiles Lua directly into your Rust binary.
mlua = { version = "0.12", features = ["lua53", "vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
